name: 编译 VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: 拉代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置
        run: cmake -B build -A x64

      - name: 编译
        run: cmake --build build --config Release --parallel

      - name: 上传插件
        uses: actions/upload-artifact@v4
        with:
          name: AutoVocalMatch-Windows
          path: |
            build/AutoVocalMatch_artefacts/Release/VST3/AutoVocalMatch.vst3
